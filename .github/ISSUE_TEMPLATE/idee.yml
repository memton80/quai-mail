name: Proposer une idée
description: Une fonction qui vous manque dans Quai Mail.
labels: ["enhancement"]
body:
  - type: input
    id: domaine
    attributes:
      label: Partie de Quai Mail concernée
      placeholder: "Recherche, règles de tri, conversations, signatures, calendrier…"
  - type: textarea
    id: description
    attributes:
      label: Ce que vous aimeriez pouvoir faire, et pourquoi
      description: Décrivez la situation où cette fonction vous servirait.
    validations:
      required: true
