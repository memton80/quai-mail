name: Build

on:
  push:
    # Toutes les branches (seule main publie une release, voir le job « version »).
    branches: ['**']
    # Tag poussé à la main.
    tags: ['v*', 'V*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'QuaiMail.sln'
      - 'Directory.*'
      - 'global.json'
      - 'installer/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'QuaiMail.sln'
      - 'Directory.*'
      - 'global.json'
      - 'installer/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Version de la construction et décision de publier (même règle que Quai).
  # La version se prépare dans Directory.Build.props (<Version>X.Y.Z</Version>). Quand elle arrive sur main sans
  # tag correspondant, ce run la construit, puis le job « release » crée le tag vX.Y.Z et publie la release.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Version et publication
        id: version
        shell: bash
        run: |
          set -euo pipefail
          prepared=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props || true)
          if ! [[ "$prepared" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=Directory.Build.props::<Version> doit être de la forme X.Y.Z (trouvé : « $prepared »)."
            exit 1
          fi

          tags=$(git ls-remote --tags origin)
          if grep -qiE "refs/tags/v${prepared//./\\.}$" <<<"$tags"; then tagged=true; else tagged=false; fi

          case "$GITHUB_REF" in
            refs/tags/[vV]*)
              version="${GITHUB_REF_NAME:1}"; tag="$GITHUB_REF_NAME"; release=true ;;
            refs/heads/main)
              if [ "$tagged" = false ]; then
                version="$prepared"; tag="v$prepared"; release=true
              else
                version="0.0.0-ci.$GITHUB_RUN_NUMBER"; tag=""; release=false
              fi ;;
            *)
              version="0.0.0-ci.$GITHUB_RUN_NUMBER"; tag=""; release=false ;;
          esac

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Version préparée (Directory.Build.props) : **$prepared** — tag v$prepared déjà présent : **$tagged**"
            echo
            echo "Construction : **$version** — publication : **$release** ${tag:+(tag $tag)}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Version préparée $prepared (tag présent : $tagged) ; construction $version ; publication : $release"

  build:
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # .NET 10 = dernière LTS, prise en charge par le Windows App SDK 2.x (voir docs/DECISIONS.md).
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore QuaiMail.sln

      - name: Tests (QuaiMail.Core)
        if: matrix.platform == 'x64'
        run: dotnet test --project tests/QuaiMail.Core.Tests/QuaiMail.Core.Tests.csproj -c Release

      # Identifiants de Quai Mail chez Google et Microsoft (connexion par le navigateur, docs/OAUTH.md) : lus par
      # MSBuild dans l'environnement, intégrés au programme. Absents (dépôt dérivé, secrets non créés) : pas de bouton.
      - name: Publish
        shell: pwsh
        env:
          QuaiMailGoogleClientId: ${{ secrets.QUAI_MAIL_GOOGLE_CLIENT_ID }}
          QuaiMailGoogleClientSecret: ${{ secrets.QUAI_MAIL_GOOGLE_CLIENT_SECRET }}
          QuaiMailMicrosoftClientId: ${{ secrets.QUAI_MAIL_MICROSOFT_CLIENT_ID }}
        run: |
          dotnet publish src/QuaiMail.App/QuaiMail.App.csproj `
            -c Release `
            -r win-${{ matrix.platform }} `
            --self-contained true `
            -p:Platform=${{ matrix.platform }} `
            -p:WindowsPackageType=None `
            -p:Version=${{ needs.version.outputs.version }} `
            -o publish/${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw "La publication a échoué (code $LASTEXITCODE)." }

          # Agent de notification : compilé en natif (Native AOT), seul son exécutable rejoint Quai Mail.
          dotnet publish src/QuaiMail.Agent/QuaiMail.Agent.csproj `
            -c Release `
            -r win-${{ matrix.platform }} `
            -p:Platform=${{ matrix.platform }} `
            -p:Version=${{ needs.version.outputs.version }} `
            -o publish/agent-${{ matrix.platform }}
          if ($LASTEXITCODE -ne 0) { throw "La publication de l'agent a échoué (code $LASTEXITCODE)." }
          Copy-Item "publish/agent-${{ matrix.platform }}/QuaiMailAgent.exe" "publish/${{ matrix.platform }}/"

      - name: Vérification du contenu publié
        shell: pwsh
        run: |
          $dir = "publish/${{ matrix.platform }}"
          Get-ChildItem $dir | Sort-Object Name | Format-Table Name, Length -AutoSize | Out-String -Width 200
          $required = @(
            'QuaiMail.exe', 'QuaiMailAgent.exe', 'QuaiMail.dll', 'QuaiMail.Core.dll', 'QuaiMail.pri', 'Microsoft.WinUI.dll', 'Microsoft.Web.WebView2.Core.dll', 'WebView2Loader.dll',
            'Assets/QuaiMail.ico', 'Assets/AppIcon.png', 'Assets/Mail/reader.html', 'Assets/Mail/mail.css', 'fr-FR/Microsoft.ui.xaml.dll.mui', 'en-US/Microsoft.ui.xaml.dll.mui')
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw "Fichiers manquants dans la publication : $($missing -join ', ')" }

          # WebView2 sert uniquement à afficher le corps des mails (verrouillé : voir CLAUDE.md), pas d'application web
          # cachée : aucun JavaScript livré, aucun HTML en dehors du gabarit de lecture (Assets/Mail). Allègement repris
          # de Quai : ni IA / ML / recherche / widgets du Windows App SDK, ni outils de diagnostic du runtime, ni langues
          # autres que fr / en.
          $forbidden = @(
            'Microsoft.UI.Xaml/Assets/map.html',
            'onnxruntime.dll', 'DirectML.dll', 'Microsoft.Windows.AI.Text.dll', 'Microsoft.Windows.Search.dll', 'Microsoft.Windows.Widgets.dll', 'DWriteCore.dll',
            'PresentationFramework.dll', 'createdump.exe', 'mscordbi.dll', 'mscordaccore.dll', 'de-DE', 'ja-JP',
            # L'agent est un exécutable natif, sans runtime .NET à côté.
            'QuaiMailAgent.dll', 'QuaiMailAgent.runtimeconfig.json', 'QuaiMailAgent.deps.json') |
            Where-Object { Test-Path (Join-Path $dir $_) }
          $web = Get-ChildItem $dir -Recurse -File -Include '*.html', '*.htm', '*.js' |
            Where-Object { $_.FullName -notmatch '[\\/]Assets[\\/]Mail[\\/]' } | Select-Object -First 5
          if ($web) { $forbidden += $web.FullName }
          # Règle CSS : jamais dans le HTML (ni balise <style>, ni attribut style=) — les styles vont dans mail.css.
          $inline = Get-ChildItem (Join-Path $dir 'Assets/Mail') -Recurse -File -Include '*.html', '*.htm' -ErrorAction SilentlyContinue |
            Select-String -Pattern '<style|\sstyle\s*=' | Select-Object -First 5
          if ($inline) { $forbidden += $inline | ForEach-Object { "$($_.Path):$($_.LineNumber) (CSS dans le HTML)" } }
          if ($forbidden) { throw "Fichiers inattendus dans la publication : $($forbidden -join ', ')" }

      - name: Zip (version portable)
        shell: pwsh
        run: 7z a -tzip -mx=9 "QuaiMail-${{ matrix.platform }}.zip" "./publish/${{ matrix.platform }}/*"

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y | Out-Host
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe (Inno Setup) introuvable.' }

          $version = '${{ needs.version.outputs.version }}'
          $numeric = ($version -split '-')[0]
          $source = (Resolve-Path 'publish/${{ matrix.platform }}').Path
          & $iscc /Qp "/DAppVersion=$version" "/DAppNumericVersion=$numeric" "/DArch=${{ matrix.platform }}" "/DSourceDir=$source" "/DOutputDir=$PWD" installer/QuaiMail.iss
          if ($LASTEXITCODE -ne 0) { throw "La compilation de l'installateur a échoué (code $LASTEXITCODE)." }
          Get-Item 'QuaiMail-Setup-${{ matrix.platform }}.exe', 'QuaiMail-${{ matrix.platform }}.zip' |
            Select-Object Name, @{ n = 'Mo'; e = { [math]::Round($_.Length / 1MB, 1) } } | Format-Table -AutoSize | Out-String

      - name: Rapport de taille
        shell: pwsh
        run: |
          $arch = '${{ matrix.platform }}'
          $files = Get-ChildItem "publish/$arch" -Recurse -File
          $mb = { param($bytes) '{0:N1}' -f ($bytes / 1MB) }
          $installed = ($files | Measure-Object Length -Sum).Sum
          $setup = (Get-Item "QuaiMail-Setup-$arch.exe").Length
          $zip = (Get-Item "QuaiMail-$arch.zip").Length
          @(
            "### Taille ($arch)"
            ''
            '| | Mo |'
            '|---|---:|'
            "| Installée ($($files.Count) fichiers) | $(& $mb $installed) |"
            "| dont l'agent de notification (natif) | $(& $mb (Get-Item "publish/$arch/QuaiMailAgent.exe").Length) |"
            "| Installateur | $(& $mb $setup) |"
            "| Zip | $(& $mb $zip) |"
            ''
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "Installée : $(& $mb $installed) Mo ($($files.Count) fichiers) — installateur : $(& $mb $setup) Mo — zip : $(& $mb $zip) Mo"

      - name: Installation silencieuse
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $setup = (Resolve-Path 'QuaiMail-Setup-x64.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=`"$log`"" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 60 }
            throw "Installation en échec (code $($process.ExitCode))."
          }

          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Quai Mail'
          $missing = 'QuaiMail.exe', 'QuaiMailAgent.exe', 'unins000.exe', 'QuaiMail.pri', 'QuaiMail.Core.dll', 'WebView2Loader.dll' | Where-Object { -not (Test-Path (Join-Path $dir $_)) }
          if ($missing) { throw "Fichiers installés manquants : $($missing -join ', ')" }

          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{45AC4609-96F5-4C2C-A740-E243A390EA78}_is1'
          if (-not (Test-Path $key)) { throw "Entrée de désinstallation absente du registre." }
          Get-ItemProperty $key | Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString | Format-List | Out-String


          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Quai Mail.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Raccourci du menu Démarrer absent.' }

          # « Ouvrir avec » pour les liens mailto: (applications par défaut de Windows).
          $command = (Get-ItemProperty 'HKCU:\Software\Classes\QuaiMail.mailto\shell\open\command').'(default)'
          if ($command -notlike "*QuaiMail.exe*%1*") { throw "Commande des liens mailto inattendue : $command" }
          $mailto = (Get-ItemProperty 'HKCU:\Software\Quai Mail\Capabilities\URLAssociations').mailto
          if ($mailto -ne 'QuaiMail.mailto') { throw "Association mailto absente des capacités de Quai Mail." }
          $registered = (Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue).'Quai Mail'
          if ($registered -ne 'Software\Quai Mail\Capabilities') { throw "Quai Mail absent des applications inscrites." }
          "QUAI_MAIL_INSTALL_DIR=$dir" >> $env:GITHUB_ENV

      - name: Test de fumée (application installée, lancement réel)
        if: matrix.platform == 'x64'
        shell: pwsh
        env:
          OAUTH_GOOGLE: ${{ secrets.QUAI_MAIL_GOOGLE_CLIENT_ID != '' }}
          OAUTH_MICROSOFT: ${{ secrets.QUAI_MAIL_MICROSOFT_CLIENT_ID != '' }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke'
          $exe = Join-Path $env:QUAI_MAIL_INSTALL_DIR 'QuaiMail.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "`"$out`"" -PassThru
          $null = $process.Handle
          if (-not $process.WaitForExit(300000)) {
            $process.Kill()
            Write-Host "::error::Le test de fumée n'a pas rendu la main en 300 s."
            $failed = $true
          } elseif ($process.ExitCode -ne 0) {
            Write-Host "::error::Le test de fumée a échoué (code $($process.ExitCode))."
            $failed = $true
          }
          if (Test-Path $out) { Get-ChildItem $out -File | Format-Table Name, Length -AutoSize | Out-String }
          if (Test-Path (Join-Path $out 'smoke-report.txt')) {
            Get-Content (Join-Path $out 'smoke-report.txt')
            @('### Test de fumée', '', '```') + (Get-Content (Join-Path $out 'smoke-report.txt')) + @('```', '') |
              Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if ($failed -or -not (Test-Path (Join-Path $out 'smoke-ok.txt'))) {
            if (Test-Path (Join-Path $out 'smoke-error.txt')) { Get-Content (Join-Path $out 'smoke-error.txt') }
            Get-ChildItem (Join-Path $out 'data/logs') -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }
            Get-WinEvent -LogName Application -MaxEvents 40 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
              Select-Object -First 6 | ForEach-Object { $_.Message }
            throw 'Test de fumée en échec.'
          }
          # Connexion par le navigateur : intégrée exactement quand les secrets existent.
          $google = if ($env:OAUTH_GOOGLE -eq 'true') { 'oui' } else { 'non' }
          $microsoft = if ($env:OAUTH_MICROSOFT -eq 'true') { 'oui' } else { 'non' }
          $expected = "Inscription OAuth intégrée à cette compilation : Google $google, Microsoft $microsoft"
          if (-not (Select-String -Path (Join-Path $out 'smoke-report.txt') -SimpleMatch $expected -Quiet)) {
            throw "Inscription OAuth : « $expected » attendu dans le rapport."
          }

      # Le bouton « Mettre à jour » pour de vrai (repris de Quai) : Quai Mail installé, avec un brouillon ouvert, se voit
      # proposer l'installateur qui vient d'être construit (servi depuis le disque à la place de GitHub, avec sa vraie
      # empreinte), le télécharge, le vérifie, le lance en silencieux et se ferme ; l'installateur doit réussir et
      # relancer Quai Mail, qui restaure l'état de la fenêtre.
      - name: Mise à jour en place (téléchargement vérifié, installation silencieuse, relance)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'update'
          $exe = Join-Path $env:QUAI_MAIL_INSTALL_DIR 'QuaiMail.exe'
          $setup = (Resolve-Path 'QuaiMail-Setup-x64.exe').Path
          $log = Join-Path $out 'data/logs/update-install.log'
          $process = Start-Process -FilePath $exe -ArgumentList '--update-test', "`"$out`"", "`"$setup`"" -PassThru
          $null = $process.Handle
          $failure = $null
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            $failure = "Quai Mail ne s'est pas fermé pour installer la mise à jour (120 s)."
          } elseif ($process.ExitCode -ne 0) {
            $failure = "Quai Mail a quitté avec le code $($process.ExitCode) pendant la mise à jour."
          } else {
            $deadline = (Get-Date).AddSeconds(180)
            $done = $false
            $relaunched = @()
            while ((Get-Date) -lt $deadline) {
              $done = (Test-Path $log) -and (Select-String -Path $log -Pattern 'Installation process succeeded' -SimpleMatch -Quiet)
              $relaunched = @(Get-Process -Name QuaiMail -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $process.ExitTime })
              if ($done -and $relaunched.Count -gt 0) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $done) { $failure = "L'installateur n'a pas terminé la mise à jour." }
            elseif ($relaunched.Count -eq 0) { $failure = "Quai Mail n'a pas été relancé après la mise à jour." }
            else {
              # La nouvelle version sait qu'elle vient d'être relancée (--after-update) et restaure l'état de la fenêtre.
              # (expressions régulières : Serilog écrit les noms de fichiers entre guillemets)
              $expected = @('Démarrage juste après une mise à jour', 'Brouillon rouvert après la mise à jour', 'État de la fenêtre restauré après la mise à jour')
              $missing = $expected
              $deadline = (Get-Date).AddSeconds(30)
              while ($missing -and (Get-Date) -lt $deadline) {
                $logs = Get-ChildItem (Join-Path $out 'data/logs') -Filter 'quaimail-*.log' -ErrorAction SilentlyContinue
                $missing = @($expected | Where-Object { -not ($logs | Select-String -Pattern $_ -Quiet) })
                if ($missing) { Start-Sleep -Seconds 1 }
              }
              if ($missing) { $failure = "Après la mise à jour, absent du journal : $($missing -join ' ; ')" }
            }
          }
          if (Test-Path $log) {
            Get-Content $log | Select-String -CaseSensitive -Pattern 'Setup command line:', 'RestartManager', 'Installation process', '-- Run entry --', 'Filename: ', 'Parameters: ', 'Process exit code' |
              ForEach-Object { $_.Line }
          }
          # Arrêt des instances lancées après la fermeture pour mise à jour : un Quai Mail resté ouvert verrouille ses
          # fichiers et ferait échouer la désinstallation qui suit.
          if ($process.HasExited) {
            $started = @(Get-Process -Name QuaiMail -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $process.ExitTime })
            if ($started) {
              $started | Stop-Process -Force -ErrorAction SilentlyContinue
              $started | Wait-Process -Timeout 30 -ErrorAction SilentlyContinue
            }
          }
          if ($failure) {
            if (Test-Path (Join-Path $out 'smoke-error.txt')) { Get-Content (Join-Path $out 'smoke-error.txt') }
            Get-ChildItem (Join-Path $out 'data/logs') -Filter 'quaimail-*.log' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 40 }
            if (Test-Path $log) { Get-Content $log -Tail 40 }
            throw $failure
          }
          $line = 'Mise à jour en place : installateur téléchargé et vérifié (SHA-256), installé en silencieux, Quai Mail relancé, état de la fenêtre et brouillon restaurés : OK'
          $line
          @('### Mise à jour en place', '', $line, '') | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # Agent de notification installé, contre un faux serveur IMAP local (TLS, IDLE ; jamais de vrai compte). Règles
      # d'Alexandre vérifiées : au plus 10 Mo de mémoire privée (colonne « Mémoire » du Gestionnaire des tâches), mesurée
      # pendant tout le test ; processeur au repos en attendant un mail. Puis : notification d'un nouveau mail, pause
      # quand Quai Mail s'ouvre (verrou simulé, puis le vrai Quai Mail ouvert par le menu de l'icône), commandes du menu
      # (lancement avec Windows, arrêt), --quit, mise à jour avec l'agent lancé (arrêté puis relancé par l'installateur).
      - name: Agent de notification (mémoire, processeur, pause, menu, mise à jour)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'agent'
          $server = Join-Path $root 'server'
          $data = Join-Path $root 'data'
          New-Item -ItemType Directory -Force -Path $server, (Join-Path $data 'logs') | Out-Null
          $agentExe = Join-Path $env:QUAI_MAIL_INSTALL_DIR 'QuaiMailAgent.exe'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $limit = 10MB

          Add-Type -Namespace QuaiMailCi -Name User32 -MemberDefinition @'
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string className, string windowName);
          [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
          '@

          $samples = [System.Collections.Generic.List[object]]::new()
          function Get-Agent { Get-Process -Name QuaiMailAgent -ErrorAction SilentlyContinue | Select-Object -First 1 }
          function Sample([string] $phase) {
            $p = Get-Agent
            if (-not $p) { return }
            $private = $null
            try { $private = (Get-Counter '\Process(QuaiMailAgent)\Working Set - Private' -ErrorAction Stop).CounterSamples[0].CookedValue } catch { }
            if ($null -eq $private) { $private = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate }
            $samples.Add([pscustomobject]@{ Phase = $phase; Private = [double]$private; Commit = $p.PrivateMemorySize64; WorkingSet = $p.WorkingSet64; Threads = $p.Threads.Count })
          }
          function Read-Log([string] $pattern) {
            $text = ''
            foreach ($file in Get-ChildItem (Join-Path $data 'logs') -Filter $pattern -ErrorAction SilentlyContinue) {
              $stream = [System.IO.File]::Open($file.FullName, 'Open', 'Read', 'ReadWrite')
              try { $text += (New-Object System.IO.StreamReader($stream)).ReadToEnd() } finally { $stream.Dispose() }
            }
            $text
          }
          function Count-Log([string] $text) { ([regex]::Matches((Read-Log 'agent-*.log'), [regex]::Escape($text))).Count }
          function Idling { if (Test-Path (Join-Path $server 'idling.txt')) { [int](Get-Content (Join-Path $server 'idling.txt')) } else { -1 } }
          function Wait-Until([scriptblock] $condition, [int] $seconds, [string] $what) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while (-not (& $condition)) {
              if ((Get-Date) -gt $deadline) { throw "Délai dépassé ($seconds s) : $what" }
              Sample $what
              Start-Sleep -Milliseconds 300
            }
          }
          function Send-Command([int] $id) {
            $window = [QuaiMailCi.User32]::FindWindow('QuaiMail.Agent', $null)
            if ($window -eq [IntPtr]::Zero) { throw "Fenêtre de l'agent introuvable." }
            [void][QuaiMailCi.User32]::PostMessage($window, 0x0111, [IntPtr]$id, [IntPtr]::Zero)
          }
          function AutoStart { $run = Get-ItemProperty $runKey -ErrorAction SilentlyContinue; $run -and ($run.PSObject.Properties.Name -contains 'QuaiMailAgent') }

          $fake = $null
          $cert = $null
          try {
            # Faux serveur IMAP, son certificat « localhost » approuvé sur la machine du CI (validation TLS stricte inchangée).
            dotnet build tests/QuaiMail.FakeMailServer/QuaiMail.FakeMailServer.csproj -c Release -o (Join-Path $root 'fake') | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Faux serveur IMAP non compilé.' }
            $fake = Start-Process -FilePath dotnet -ArgumentList "`"$(Join-Path $root 'fake/QuaiMail.FakeMailServer.dll')`"", "`"$server`"" -PassThru -NoNewWindow `
              -RedirectStandardOutput (Join-Path $root 'server.log') -RedirectStandardError (Join-Path $root 'server-error.log')
            Wait-Until { Test-Path (Join-Path $server 'port.txt') } 60 'démarrage du faux serveur'
            $port = [int](Get-Content (Join-Path $server 'port.txt'))
            $cert = Import-Certificate -FilePath (Join-Path $server 'server.cer') -CertStoreLocation Cert:\LocalMachine\Root

            # Un compte de test (données isolées), son mot de passe dans le coffre de Windows (effacé par --purge-secrets à la désinstallation).
            $id = '0123456789abcdef0123456789abcdef'
            @{ accounts = @(@{
                id = $id; address = 'alice@example.org'; displayName = 'Compte de test'; userName = 'alice@example.org'
                imap = @{ host = 'localhost'; port = $port; security = 'sslOnConnect' }
                smtp = @{ host = 'localhost'; port = 1; security = 'sslOnConnect' } }) } |
              ConvertTo-Json -Depth 5 | Set-Content (Join-Path $data 'accounts.json') -Encoding utf8
            '{ "checkForUpdates": false }' | Set-Content (Join-Path $data 'settings.json') -Encoding utf8
            powershell.exe -NoProfile -Command "[void][Windows.Security.Credentials.PasswordVault,Windows.Security.Credentials,ContentType=WindowsRuntime]; (New-Object Windows.Security.Credentials.PasswordVault).Add((New-Object Windows.Security.Credentials.PasswordCredential('QuaiMail', '$id', 'mot de passe de test')))"
            if ($LASTEXITCODE -ne 0) { throw 'Mot de passe de test non enregistré dans le coffre de Windows.' }
            $env:QUAI_MAIL_DATA_DIR = $data

            # 1. Démarrage : connexion TLS, IDLE.
            $agent = Start-Process -FilePath $agentExe -PassThru
            $null = $agent.Handle
            Wait-Until { (Idling) -eq 1 } 90 'connexion de l''agent en IDLE'

            # 2. Un nouveau mail : notification (le journal ne contient que le nombre).
            New-Item -ItemType File (Join-Path $server 'deliver.txt') | Out-Null
            Wait-Until { (Count-Log 'Notification affichée') -ge 1 } 60 'notification du nouveau mail'
            if ((Read-Log 'agent-*.log') -cmatch 'Nouveau mail \d|test@example\.org|Expéditrice de test') { throw 'Le journal de l''agent contient le contenu d''un mail.' }

            # 3. Au repos : processeur et mémoire (après la remise de mémoire qui suit l'activité).
            $deadline = (Get-Date).AddSeconds(25); while ((Get-Date) -lt $deadline) { Sample 'après le mail'; Start-Sleep -Milliseconds 300 }
            $agent.Refresh(); $cpuBefore = $agent.TotalProcessorTime
            $deadline = (Get-Date).AddSeconds(30); while ((Get-Date) -lt $deadline) { Sample 'repos'; Start-Sleep -Milliseconds 300 }
            $agent.Refresh(); $idleCpu = ($agent.TotalProcessorTime - $cpuBefore).TotalMilliseconds
            if ($idleCpu -gt 150) { throw "Processeur au repos : $([math]::Round($idleCpu)) ms en 30 s (150 ms au plus)." }

            # 4. Quai Mail s'ouvre (verrou simulé) : l'agent coupe ses connexions, puis reprend à sa fermeture.
            $appMutex = [System.Threading.Mutex]::new($true, 'Local\QuaiMail.App.Running')
            $started = $null
            if ([System.Threading.EventWaitHandle]::TryOpenExisting('Local\QuaiMail.App.Started', [ref] $started)) { [void]$started.Set(); $started.Dispose() }
            Wait-Until { (Idling) -eq 0 -and (Count-Log 'En pause') -ge 1 } 60 'pause de l''agent'
            $appMutex.ReleaseMutex(); $appMutex.Dispose()
            Wait-Until { (Idling) -eq 1 -and (Count-Log 'reprise de la surveillance') -ge 1 } 60 'reprise après la fermeture'

            # 5. Menu de l'icône : « Lancer avec Windows » (coché, décoché, recoché), avec le chemin de l'agent installé.
            Send-Command 2; Wait-Until { AutoStart } 15 'lancement avec Windows activé'
            $value = (Get-ItemProperty $runKey).QuaiMailAgent
            if ($value -ne "`"$agentExe`"") { throw "Lancement avec Windows inattendu : $value" }
            Send-Command 2; Wait-Until { -not (AutoStart) } 15 'lancement avec Windows désactivé'
            Send-Command 2; Wait-Until { AutoStart } 15 'lancement avec Windows réactivé'

            # 6. « Ouvrir Quai Mail » : le vrai Quai Mail s'ouvre, l'agent se met en pause ; fermé, l'agent reprend.
            $opened = Get-Date
            Send-Command 1
            Wait-Until { @(Get-Process -Name QuaiMail -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -gt $opened -and $_.MainWindowHandle -ne 0 }).Count -gt 0 } 90 'ouverture de Quai Mail'
            Wait-Until { (Count-Log 'En pause') -ge 2 } 60 'pause de l''agent pendant que Quai Mail est ouvert'
            $app = Get-Process -Name QuaiMail | Where-Object { $_.StartTime -gt $opened } | Select-Object -First 1
            $null = $app.CloseMainWindow()
            if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Quai Mail ne s''est pas fermé.' }
            Wait-Until { (Count-Log 'reprise de la surveillance') -ge 2 -and (Idling) -eq 1 } 60 'reprise après la fermeture de Quai Mail'

            # 7. Mise à jour avec l'agent lancé : arrêté avant de remplacer les fichiers, relancé ensuite.
            $installing = Get-Date
            $setup = (Resolve-Path 'QuaiMail-Setup-x64.exe').Path
            $log = Join-Path $root 'install-agent.log'
            $install = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=`"$log`"" -PassThru -Wait
            if ($install.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Mise à jour avec l'agent lancé en échec (code $($install.ExitCode))." }
            if (-not $agent.HasExited) { throw "L'ancien agent tourne encore après la mise à jour." }
            Wait-Until { (Get-Agent) -and (Get-Agent).StartTime -gt $installing } 60 'agent relancé par l''installateur'
            Wait-Until { (Idling) -eq 1 } 90 'reconnexion du nouvel agent'
            $agent = Get-Agent; $null = $agent.Handle

            # 8. « Arrêter l'agent » (menu), puis --quit.
            Send-Command 3
            if (-not $agent.WaitForExit(15000)) { throw "L'agent ne s'est pas arrêté depuis son menu." }
            if ($agent.ExitCode -ne 0) { throw "Agent arrêté avec le code $($agent.ExitCode)." }
            Wait-Until { (Idling) -eq 0 } 30 'connexions fermées à l''arrêt'
            $agent = Start-Process -FilePath $agentExe -PassThru; $null = $agent.Handle
            Wait-Until { (Idling) -eq 1 } 90 'agent relancé'
            $quit = Start-Process -FilePath $agentExe -ArgumentList '--quit' -PassThru -Wait
            if ($quit.ExitCode -ne 0 -or -not $agent.WaitForExit(15000)) { throw "--quit n'a pas arrêté l'agent (code $($quit.ExitCode))." }
            $again = Start-Process -FilePath $agentExe -ArgumentList '--quit' -PassThru -Wait
            if ($again.ExitCode -ne 1) { throw "--quit sans agent lancé : code $($again.ExitCode) (1 attendu)." }

            # Mémoire : la plus haute mesure de tout le test.
            $measured = @($samples | Where-Object { $_.Private -gt 0 })
            if ($measured.Count -lt 20) { throw "Trop peu de mesures de mémoire ($($measured.Count))." }
            $peak = $measured | Sort-Object Private -Descending | Select-Object -First 1
            $rest = @($measured | Where-Object Phase -eq 'repos')
            $mib = { param($bytes) '{0:N1}' -f ($bytes / 1MB) }
            $table = @(
              '| Mesure | Valeur |', '|---|---:|'
              "| Mémoire privée, la plus haute ($($measured.Count) mesures) | $(& $mib $peak.Private) Mo ($($peak.Phase)) |"
              "| Mémoire privée au repos | $(& $mib ($rest | Measure-Object Private -Maximum).Maximum) Mo |"
              "| Mémoire engagée au repos | $(& $mib ($rest | Measure-Object Commit -Maximum).Maximum) Mo |"
              "| Fils d'exécution au repos | $(($rest | Measure-Object Threads -Maximum).Maximum) |"
              "| Processeur au repos (30 s) | $([math]::Round($idleCpu)) ms |")
            $table
            @('### Agent de notification', '') + $table + @('') | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            if ($peak.Private -gt $limit) { throw "Mémoire de l'agent : $(& $mib $peak.Private) Mo pendant « $($peak.Phase) » (10 Mo au plus)." }

            # L'agent reste lancé, avec le lancement avec Windows : la désinstallation doit tout retirer.
            Start-Process -FilePath $agentExe | Out-Null
            Wait-Until { (Idling) -eq 1 } 90 'agent lancé avant la désinstallation'
            'Agent de notification : OK'
          } catch {
            Write-Host "::error::$($_.Exception.Message)"
            Write-Host '--- journal de l''agent ---'; Read-Log 'agent-*.log' | Write-Host
            Write-Host '--- journal de Quai Mail ---'; (Read-Log 'quaimail-*.log') -split "`n" | Select-Object -Last 40 | Write-Host
            Write-Host '--- faux serveur ---'; Get-Content (Join-Path $root 'server.log') -Tail 40 -ErrorAction SilentlyContinue
            Get-Content (Join-Path $root 'server-error.log') -Tail 20 -ErrorAction SilentlyContinue
            $samples | Select-Object -Last 15 | Format-Table -AutoSize | Out-String | Write-Host
            throw
          } finally {
            New-Item -ItemType File -Force (Join-Path $server 'stop.txt') | Out-Null
            if ($fake -and -not $fake.WaitForExit(10000)) { $fake.Kill() }
            if ($cert) { Remove-Item -Path "Cert:\LocalMachine\Root\$($cert.Thumbprint)" -ErrorAction SilentlyContinue }
          }

      - name: Captures du test de fumée
        if: always() && matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-captures
          path: |
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/*.txt
            ${{ runner.temp }}/smoke/data/logs/*.log
            ${{ runner.temp }}/update/*.png
            ${{ runner.temp }}/update/*.txt
            ${{ runner.temp }}/update/data/logs/*.log
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/agent/data/logs/*.log
            ${{ runner.temp }}/agent/*.log
          if-no-files-found: ignore

      - name: Désinstallation silencieuse (avec effacement des données)
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $dir = $env:QUAI_MAIL_INSTALL_DIR
          $data = Join-Path $env:LOCALAPPDATA 'QuaiMail'

          # Données factices : elles doivent disparaître avec /PURGE=1.
          New-Item -ItemType Directory -Force -Path (Join-Path $data 'logs') | Out-Null
          Set-Content -Path (Join-Path $data 'settings.json') -Value '{ "theme": "dark" }'
          Set-Content -Path (Join-Path $data 'accounts.json') -Value '{ "accounts": [] }'
          New-Item -ItemType Directory -Force -Path (Join-Path $data 'cache') | Out-Null

          # Le commutateur utilisé par le désinstallateur pour vider le coffre de Windows doit fonctionner (repris de Quai).
          $purge = Start-Process -FilePath (Join-Path $dir 'QuaiMail.exe') -ArgumentList '--purge-secrets' -PassThru -Wait
          if ($purge.ExitCode -ne 0) { throw "--purge-secrets a échoué (code $($purge.ExitCode))." }

          # L'agent de notification tourne et se lance avec Windows (étape précédente) : la désinstallation doit tout retirer.
          if (-not (Get-Process -Name QuaiMailAgent -ErrorAction SilentlyContinue)) { throw "L'agent de notification devrait tourner avant la désinstallation." }

          $uninstall = Start-Process -FilePath (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/PURGE=1' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Désinstallation en échec (code $($uninstall.ExitCode))." }

          # Le désinstallateur termine son nettoyage depuis une copie temporaire : on laisse quelques secondes.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $dir) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 1 }

          $left = @()
          if (Test-Path $dir) { $left += "dossier d'installation ($((Get-ChildItem $dir -Recurse -File | Select-Object -First 5).FullName -join ', '))" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{45AC4609-96F5-4C2C-A740-E243A390EA78}_is1') { $left += 'entrée de désinstallation' }
          if (Test-Path (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Quai Mail.lnk')) { $left += 'raccourci du menu Démarrer' }
          if (Test-Path 'HKCU:\Software\Classes\QuaiMail.mailto') { $left += 'type de lien QuaiMail.mailto' }
          if (Test-Path 'HKCU:\Software\Quai Mail') { $left += 'capacités de Quai Mail' }
          $registered = Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -ErrorAction SilentlyContinue
          if ($registered -and ($registered.PSObject.Properties.Name -contains 'Quai Mail')) { $left += 'inscription dans les applications par défaut' }
          if (Test-Path $data) { $left += 'données utilisateur' }
          if (Get-Process -Name QuaiMailAgent -ErrorAction SilentlyContinue) { $left += 'agent de notification encore lancé' }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if ($run -and ($run.PSObject.Properties.Name -contains 'QuaiMailAgent')) { $left += "lancement de l'agent avec Windows" }
          if ($left) { throw "La désinstallation a laissé : $($left -join ' ; ')" }
          Write-Host 'Désinstallation complète : aucun fichier, raccourci ni entrée de registre restant.'

      - uses: actions/upload-artifact@v4
        with:
          name: QuaiMail-${{ matrix.platform }}
          path: |
            QuaiMail-${{ matrix.platform }}.zip
            QuaiMail-Setup-${{ matrix.platform }}.exe
          if-no-files-found: error

  # Crée le tag (s'il n'existe pas encore) et la release, une fois tout vert.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Clé de l'API publique (gratuite) de VirusTotal, dans les secrets du dépôt. Sans elle, l'analyse est sautée.
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: QuaiMail-*
          path: dist
          merge-multiple: true

      - name: VirusTotal
        id: virustotal
        if: env.VT_API_KEY != ''
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ env.VT_API_KEY }}
          request_rate: 4
          files: |
            dist/*.exe
            dist/*.zip

      - name: Notes de la release (empreintes, analyses VirusTotal)
        id: notes
        shell: bash
        env:
          SCANNED: ${{ steps.virustotal.outcome == 'success' }}
        run: |
          set -euo pipefail
          {
            echo 'body<<QUAI_MAIL_NOTES_EOF'
            echo '### Fichiers'
            echo
            if [ "$SCANNED" = true ]; then
              echo '| Fichier | SHA-256 | VirusTotal |'
              echo '|---|---|---|'
            else
              echo '| Fichier | SHA-256 |'
              echo '|---|---|'
            fi
            for file in dist/*.exe dist/*.zip; do
              hash=$(sha256sum "$file" | cut -d' ' -f1)
              name=$(basename "$file")
              if [ "$SCANNED" = true ]; then
                echo "| \`$name\` | \`$hash\` | [analyse](https://www.virustotal.com/gui/file/$hash) |"
              else
                echo "| \`$name\` | \`$hash\` |"
              fi
            done
            echo
            echo 'QUAI_MAIL_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Quai Mail ${{ needs.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
